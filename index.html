<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get ₦3,000 After Registration</title>
  <meta http-equiv="refresh" content="5;url=https://play.google.com/store/apps/details?id=com.bh.carding" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }.container {
  max-width: 420px;
  padding: 24px;
  border-radius: 12px;
  background: #0b0b0b;
  box-shadow: 0 0 20px rgba(0, 255, 0, 0.15);
}

h1 {
  color: #00c853; /* Green */
  font-size: 26px;
  margin-bottom: 12px;
}

p {
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 20px;
}

.code-box {
  border: 2px dashed #00c853;
  padding: 16px;
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #00c853;
  border-radius: 8px;
  margin-bottom: 20px;
}

.note {
  font-size: 14px;
  opacity: 0.85;
}

.spinner {
  margin: 20px auto 0;
  width: 40px;
  height: 40px;
  border: 4px solid #1a1a1a;
  border-top: 4px solid #00c853;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Get ₦3,000 After Registration</h1>
    <p>
      Sign up on Carding and use the code below to get ₦3,000.
    </p><div class="code-box">GET3K</div>

<p class="note">
  You are being redirected to the Carding app in 5 seconds…
</p>

<div class="spinner"></div>

  </div>
</body>
</html>
